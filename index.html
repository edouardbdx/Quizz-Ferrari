  .qcount-label { font-size: 10px; opacity: 0.6; letter-spacing: 1px; color: #FFD080; text-align: right; }
  .qcount { font-size: 20px; font-weight: 800; color: #fff; text-align: right; }

  .progress-track { height: 3px; background: rgba(255,255,255,0.05); }

    display: flex; align-items: center; justify-content: center; position: relative;

  .img-wrap .vignette { position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,0,0,0.35) 0%, transparent 50%); pointer-events: none; }
  .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
  .opt {
    border-radius: 10px; padding: 13px 16px; font-size: 14px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    transition: all 0.18s ease; text-align: left; width: 100%;
  }
  .opt .letter {
    min-width: 26px; height: 26px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .opt .opt-text { flex: 1; }
  .opt .mark { font-size: 17px; margin-left: auto; }
  .explanation { background: var(--bgCard2); border: 1px solid rgba(255,255,255,0.08); border-radius: 13px; padding: 17px; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
  .exp-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; font-size: 14px; font-weight: 700; }
  .exp-text { color: var(--textSec); font-size: 13px; line-height: 1.75; margin-bottom: 14px; }
  .specs { background: rgba(212,0,0,0.07); border-left: 2.5px solid var(--rosso); border-radius: 0 8px 8px 0; padding: 10px 14px; }
  .specs-title { font-size: 9px; letter-spacing: 2px; color: var(--rosso); font-weight: 700; margin-bottom: 9px; text-transform: uppercase; }
  .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .specs-grid .label { font-size: 10px; color: var(--textDim); }
  .specs-grid .value { font-size: 12px; font-weight: 600; color: var(--textPri); margin-top: 2px; }
  .btn-next {
    width: 100%; padding: 14px; background: linear-gradient(90deg, var(--rossoDark), var(--rosso));
    border: none; border-radius: 11px; color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(212,0,0,0.4); transition: opacity 0.15s;
  }
  .btn-next:hover { opacity: 0.88; }
  .counter { margin-top: 22px; background: var(--bgCard); border: 1px solid var(--borderSub); border-radius: 12px; padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; }
  .counter .c-label { font-size: 10px; color: var(--textDim); letter-spacing: 1.5px; text-transform: uppercase; }
  .counter .c-score { display: flex; align-items: baseline; gap: 5px; }
  .counter .c-score .big { font-size: 30px; font-weight: 900; color: var(--goldLight); line-height: 1; }
  .counter .c-score .small { font-size: 15px; color: var(--textDim); font-weight: 400; }
  .counter .c-pct { font-size: 11px; font-weight: 700; }
  /* Results */
  .results { position: relative; text-align: center; padding-top: 12px; }
  .podium-card { background: linear-gradient(170deg, #1E0505 0%, var(--bgCard) 100%); border-radius: 18px; padding: 28px 20px 24px; margin-bottom: 18px; border: 1px solid var(--border); overflow: hidden; position: relative; }

  .gp-label { font-size: 10px; letter-spacing: 4px; color: var(--rosso); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
  .score-label-sm { font-size: 10px; letter-spacing: 2.5px; color: var(--textDim); text-transform: uppercase; margin-bottom: 5px; }
  .score-big { font-size: 68px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--rosso) 0%, #FF6030 45%, var(--goldLight) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .score-big span { font-size: 34px; opacity: 0.65; }
  .podium-pill { display: inline-block; padding: 5px 18px; border-radius: 20px; font-size: 12px; font-weight: 800; letter-spacing: 1px; margin-top: 6px; }
  .score-label { font-size: 14px; font-weight: 700; margin-bottom: 18px; letter-spacing: 1px; }
  .recap { text-align: left; margin-bottom: 22px; }
  .recap-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 12px; margin-bottom: 5px; border-radius: 9px; font-size: 12px; }
  .recap-item .q { color: var(--textDim); font-size: 10px; margin-bottom: 2px; }
  .recap-item .detail { color: var(--textSec); font-size: 11px; }
  .btn-restart { padding: 13px 36px; background: linear-gradient(90deg, var(--rossoDark), var(--rosso)); border: none; border-radius: 11px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 18px rgba(212,0,0,0.42); }
  .confetti-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; overflow: hidden; }
  .confetti { position: absolute; top: -20px; opacity: 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fall { 0%{opacity:1;transform:translateY(0) rotate(0deg)} 100%{opacity:0;transform:translateY(110vh) rotate(720deg)} }
  @keyframes carDrive { 0%{transform:translateX(-120px) scaleX(-1);opacity:0} 60%{transform:translateX(10px) scaleX(-1);opacity:1} 80%{transform:translateX(-5px) scaleX(-1)} 100%{transform:translateX(0) scaleX(-1);opacity:1} }
  @keyframes scorePopIn { 0%{opacity:0;transform:scale(0.3)} 100%{opacity:1;transform:scale(1)} }
  @keyframes fadeSlideUp { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0)} }

  .anim-score { animation: scorePopIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.5s both; }
  .anim-pill { animation: fadeSlideUp 0.5s ease 1.2s both; }
  .anim-label { animation: fadeSlideUp 0.5s ease 1.5s both; }

    explanation: "C'est la Ferrari 296 GTS (2023–présent), version spider de la 296 GTB. Son moteur V6 biturbo hybride est une première pour une Ferrari de route milieu arrière. La teinte bleu Pozzi et les jantes à 5 branches asymétriques sont caractéristiques.",
    specs: { years: "2023 – présent", power: "830 ch combinés", engine: "3.0L V6 biturbo + moteur électrique", produced: "En production" }
  },
  {
    img: "scaglietti612",
    options: ["Ferrari 456 GT", "Ferrari 599 GTB", "Ferrari 612 Scaglietti"],
    correct: 2,
    explanation: "La Ferrari 612 Scaglietti (2004–2011) est un grand tourisme 2+2 à moteur avant V12. Son nom rend hommage au carrossier Sergio Scaglietti. Reconnaissable à sa large calandre chromée et son long capot plongeant.",
    specs: { years: "2004 – 2011", power: "540 ch", engine: "5.7L V12", produced: "~3 000 exemplaires" }
  },
  {
    img: "purosangue",
    options: ["Ferrari GTC4Lusso", "Ferrari Purosangue", "Lamborghini Urus"],
    correct: 1,
    explanation: "La Ferrari Purosangue (2023–présent) est le premier SUV de l'histoire Ferrari. Malgré son gabarit, elle conserve un V12 atmosphérique et 4 vraies portes avec accès indépendant aux places arrière.",
    specs: { years: "2023 – présent", power: "725 ch", engine: "6.5L V12 atmosphérique", produced: "En production" }
  },
  {
    img: "lm250",
    options: ["Ferrari 250 GTO", "Ferrari 250 LM", "Ferrari 275 GTB/C"],
    correct: 1,
    explanation: "C'est la Ferrari 250 LM (1963–1966), prototype d'endurance portant le numéro 21. Contrairement à la 250 GTO, la LM a son moteur en position centrale arrière. Elle a remporté les 24 Heures du Mans 1965.",
    specs: { years: "1963 – 1966", power: "320 ch", engine: "3.3L V12", produced: "32 exemplaires" }
  },
];

const QUIZ_SIZE = 20;
const OPT = [
  { bg: "rgba(180,0,0,0.18)", border: "1.5px solid rgba(180,0,0,0.45)", letter: "#E04040", text: "#F0E0E0" },
  { bg: "rgba(130,0,0,0.14)", border: "1.5px solid rgba(130,0,0,0.38)", letter: "#C03030", text: "#E8D8D8" },
  { bg: "rgba(80,0,0,0.11)",  border: "1.5px solid rgba(80,0,0,0.30)",  letter: "#A02020", text: "#DECCCC" },
];
const C = { rosso:"#D40000", green:"#2ECC71", greenBg:"rgba(46,204,113,0.12)", greenBdr:"rgba(46,204,113,0.35)",
  goldLight:"#E8B84B", textPri:"#F0EAE0", textSec:"#9A8A80", textDim:"#5A4A44", gold:"#C8952A" };

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let questions, current, selected, score, answers, finished, showCelebration;

function init(){
  questions = shuffle(ALL_QUESTIONS).slice(0, QUIZ_SIZE);
  current = 0; selected = null; score = 0; answers = []; finished = false; showCelebration = false;
  document.getElementById('q-tot').textContent = QUIZ_SIZE;
  render();
}

function scoreLabel(){
  const p = score / QUIZ_SIZE;
  if (p === 1) return { t:"FERRARISTA PERFETTO ! 🏆", c:C.goldLight };
  if (p >= 0.8) return { t:"EXPERT FERRARI ! 🔥", c:C.rosso };
  if (p >= 0.6) return { t:"BON CONNAISSEUR 👍", c:"#E07030" };
  if (p >= 0.4) return { t:"APPRENTI TIFOSO 🐎", c:"#C09040" };
  return { t:"À REVOIR LE CAVALLINO 😅", c:C.textSec };
}

function selectOption(idx){
  if (selected !== null) return;
  selected = idx;
  const ok = idx === questions[current].correct;
  if (ok) score++;
  answers.push({ ok, chosen: questions[current].options[idx], right: questions[current].options[questions[current].correct] });
  render();
}

function next(){
  if (current + 1 >= QUIZ_SIZE){ finished = true; render(); setTimeout(()=>{ showCelebration = true; render(); animateScore(); }, 200); return; }
  current++; selected = null; render();
}

function animateScore(){
  let s = 0; const el = document.getElementById('score-anim');
  if (!el) return;
  const iv = setInterval(()=>{ s++; if(el) el.firstChild.textContent = s; if (s >= score) clearInterval(iv); }, 80);
}

function render(){
  const app = document.getElementById('app');
  const answered = current + (selected !== null ? 1 : 0);
  document.getElementById('q-cur').textContent = current + 1;
  document.getElementById('progress').style.width = (current/QUIZ_SIZE*100) + '%';
  document.getElementById('qcount-wrap').style.display = finished ? 'none' : 'block';

  if (!finished){
    const q = questions[current];
    let optsHtml = '';
    q.options.forEach((opt, idx) => {
      let s;
      if (selected === null) s = OPT[idx];
      else if (idx === q.correct) s = { bg:C.greenBg, border:'2px solid '+C.green, letter:C.green, text:C.green };
      else if (idx === selected) s = { bg:'rgba(180,0,0,0.18)', border:'2px solid '+C.rosso, letter:'#FF7070', text:'#FF9090' };
      else s = { bg:'rgba(255,255,255,0.015)', border:'1.5px solid rgba(255,255,255,0.06)', letter:C.textDim, text:C.textDim };
      let mark = '';
      if (selected !== null && idx === q.correct) mark = '<span class="mark">✅</span>';
      else if (selected !== null && idx === selected) mark = '<span class="mark">❌</span>';
      const hov = selected === null ? 'onmouseenter="this.style.background=\'rgba(212,0,0,'+(0.28-idx*0.06)+')\'" onmouseleave="this.style.background=\''+s.bg+'\'"' : '';
      optsHtml += '<button class="opt" style="background:'+s.bg+';border:'+s.border+';color:'+s.text+';cursor:'+(selected===null?'pointer':'default')+'" '+hov+' onclick="selectOption('+idx+')">'
        + '<span class="letter" style="background:rgba(212,0,0,'+(0.25-idx*0.06)+');border:1px solid '+s.letter+';color:'+s.letter+'">'+String.fromCharCode(65+idx)+'</span>'
        + '<span class="opt-text">'+opt+'</span>'+mark+'</button>';
    });

    let expHtml = '';
    if (selected !== null){
      const ok = selected === q.correct;
      expHtml = '<div class="explanation">'
        + '<div class="exp-head" style="color:'+(ok?C.green:'#FF7070')+'"><span style="font-size:20px">'+(ok?'✅':'❌')+'</span>'
        + (ok ? 'Bonne réponse !' : 'Bonne réponse : '+q.options[q.correct]) + '</div>'
        + '<p class="exp-text">'+q.explanation+'</p>'
        + '<div class="specs"><div class="specs-title">Fiche technique</div><div class="specs-grid">'
        + '<div><div class="label">📅 Production</div><div class="value">'+q.specs.years+'</div></div>'
        + '<div><div class="label">⚡ Puissance</div><div class="value">'+q.specs.power+'</div></div>'
        + '<div><div class="label">🔧 Moteur</div><div class="value">'+q.specs.engine+'</div></div>'
        + '<div><div class="label">🏭 Exemplaires</div><div class="value">'+q.specs.produced+'</div></div>'
        + '</div></div></div>';
    }

    let nextHtml = '';
    if (selected !== null){
      nextHtml = '<button class="btn-next" onclick="next()">'+(current+1>=QUIZ_SIZE?'Voir les résultats 🏆':'Question suivante →')+'</button>';
    }

    const pct = answered > 0 ? Math.round(score/answered*100) : null;
    const pctColor = answered > 0 ? (score/answered >= 0.6 ? C.green : C.rosso) : C.textDim;

    app.innerHTML = '<div class="chip-row"><div class="chip">🏆 '+score+' / '+answered+'</div></div>'
      + '<div class="img-wrap"><img src="'+IMAGES[q.img]+'" alt="Ferrari"><div class="vignette"></div></div>'
      + '<div class="options">'+optsHtml+'</div>'
      + expHtml + nextHtml
      + '<div class="counter"><div class="c-label">Bonnes réponses</div>'
      + '<div class="c-score"><span class="big">'+score+'</span><span class="small">/ '+answered+'</span></div>'
      + '<div class="c-pct" style="color:'+pctColor+'">'+(pct!==null?pct+'%':'—')+'</div></div>';
  } else {
    // RESULTS
    let confetti = '';
    if (showCelebration){
      const colors = [C.rosso, C.goldLight, '#fff', '#FF6B35', '#6B0000'];
      let parts = '';
      for (let i=0;i<60;i++){
        const x = Math.random()*100, delay = i*0.04, col = colors[i%5];
        const w = 6+(i%3)*4, h = 8+(i%4)*5, br = i%3===0?'50%':'2px', dur = 1.5+(i%3)*0.4;
        parts += '<div class="confetti" style="left:'+x+'%;width:'+w+'px;height:'+h+'px;background:'+col+';border-radius:'+br+';animation:fall '+dur+'s ease-in '+delay+'s forwards;transform:rotate('+(i*37%360)+'deg)"></div>';
      }
      confetti = '<div class="confetti-layer">'+parts+'</div>';
    }
    const lab = scoreLabel();
    let podiumBg, podiumColor, podiumText;
    if (score>=16){ podiumBg='linear-gradient(90deg,#7A5800,'+C.gold+',#7A5800)'; podiumColor='#0A0000'; podiumText='🥇 PODIUM OR'; }
    else if (score>=12){ podiumBg='linear-gradient(90deg,#3A3A3A,#888,#3A3A3A)'; podiumColor='#0A0000'; podiumText='🥈 PODIUM ARGENT'; }
    else if (score>=8){ podiumBg='linear-gradient(90deg,#5C2A00,#A0622A,#5C2A00)'; podiumColor='#0A0000'; podiumText='🥉 PODIUM BRONZE'; }
    else { podiumBg='rgba(255,255,255,0.05)'; podiumColor='#555'; podiumText='🔧 PIT STOP NÉCESSAIRE'; }

    let recapHtml = '';
    answers.forEach((a,i)=>{
      recapHtml += '<div class="recap-item" style="background:'+(a.ok?C.greenBg:'rgba(180,0,0,0.08)')+';border:1px solid '+(a.ok?C.greenBdr:'rgba(180,0,0,0.22)')+'">'
        + '<span style="flex-shrink:0;margin-top:1px">'+(a.ok?'✅':'❌')+'</span><div><div class="q">Q'+(i+1)+'</div>'
        + (!a.ok ? '<div class="detail">Votre réponse : <span style="color:#FF7070">'+a.chosen+'</span> → <span style="color:'+C.green+'">'+a.right+'</span></div>' : '')
        + '</div></div>';
    });

    app.innerHTML = '<div class="results">'+confetti
      + '<div class="podium-card">'
      + '<div class="car-emoji'+(showCelebration?' anim-car':'')+'">🏎️</div>'
      + '<div class="gp-label">🏁 GRAND PRIX TERMINÉ 🏁</div>'
      + '<div style="margin:10px 0 4px"><div class="score-label-sm">Votre score</div>'
      + '<div class="score-big'+(showCelebration?' anim-score':'')+'" id="score-anim">'+(showCelebration?0:score)+'<span>/20</span></div></div>'
      + '<div class="podium-pill'+(showCelebration?' anim-pill':'')+'" style="background:'+podiumBg+';color:'+podiumColor+'">'+podiumText+'</div>'
      + '</div>'
      + '<div class="score-label'+(showCelebration?' anim-label':'')+'" style="color:'+lab.c+'">'+lab.t+'</div>'
      + '<div class="recap">'+recapHtml+'</div>'
      + '<button class="btn-restart" onclick="init()">🔄 NOUVELLE COURSE</button>'
      + '</div>';
  }
}

init();
</script>
</body>
</html>
